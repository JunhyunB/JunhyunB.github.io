  <line x1="75" y1="135" x2="115" y2="135" stroke="#d0d0d0" stroke-width="2"/>
  
  <!-- Pen -->
  <path d="M120 105 L155 70 L165 80 L130 115 Z" fill="#4ead7f"/>
  <path d="M119 106 L115 120 L130 115 Z" fill="#4ead7f"/>
