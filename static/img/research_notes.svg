  <line x1="50" y1="75" x2="65" y2="75" stroke="#4ead7f" stroke-width="2"/>
  <line x1="50" y1="90" x2="65" y2="90" stroke="#4ead7f" stroke-width="2"/>
  <line x1="50" y1="105" x2="65" y2="105" stroke="#4ead7f" stroke-width="2"/>
  <line x1="50" y1="120" x2="65" y2="120" stroke="#4ead7f" stroke-width="2"/>
