name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Install dependencies
        run: npm ci
      
      - name: Clear
        run: npm run clear
      
      # Update reviews and graph data before building
      - name: Update reviews and graph data
        run: |
          # Fix for Mac-specific commands in update scripts
          sed -i 's/stat -f/stat --format/g' ./update-latest-reviews.sh || true
          # Run update script
          bash ./update-latest-reviews.sh || true
          
      - name: Build website
        run: npm run build
        
      # Copy graph data to static directory to ensure it's included in the build
      - name: Ensure graph data is copied to static directory
        run: |
          cp build/docusaurus-graph.json static/docusaurus-graph.json || true
          # Copy the graph data back to build to ensure it's in the artifact
          cp static/docusaurus-graph.json build/ || true
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4