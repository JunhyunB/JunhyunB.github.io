name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci
        
      # Update reviews and graph data before building
      - name: Update reviews and graph data
        run: |
          # Fix for Mac-specific commands in update scripts
          sed -i 's/stat -f/stat --format/g' ./update-latest-reviews.sh || true
          # Run update script
          bash ./update-latest-reviews.sh || true
          
      - name: Build website
        run: npm run build
        
      # Copy graph data to static directory to ensure it's included in the build
      - name: Ensure graph data is copied to static directory
        run: |
          cp build/docusaurus-graph.json static/docusaurus-graph.json || true

      # Update reviews and graph data before building
      - name: Update reviews and graph data
        run: |
          # Fix for Mac-specific commands in update scripts
          sed -i 's/stat -f/stat --format/g' ./update-latest-reviews.sh || true
          # Run update script
          bash ./update-latest-reviews.sh || true
          
      # Popular action to deploy to GitHub Pages:
      # Docs: https://github.com/peaceiris/actions-gh-pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Build output to publish to the `gh-pages` branch:
          publish_dir: ./build
          # The following lines assign commit authorship to the official
          # GH-Actions bot for deploys to `gh-pages` branch:
          # https://github.com/actions/checkout/issues/13#issuecomment-724415212
          # The GH actions bot is used by default if you didn't specify the two fields.
          # You can swap them out with your own user credentials.
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com