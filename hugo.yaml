  ko:
    languageName: "한국어"
    languageCode: ko
    weight: 1
    title: "junhyun.bae"
    menu:
      main:
        - identifier: projects
          name: Publications
          url: /projects/
          weight: 5
        - identifier: posts
          name: Posts
          url: /posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /tags/
          weight: 20
        - identifier: about
          name: About
          url: /about/
          weight: 30
        - identifier: search
          name: Search
          url: /search/
          weight: 40
  en:
    languageName: "English"
    languageCode: en
    weight: 2
    title: "junhyun.bae"
    menu:
      main:
        - identifier: projects
          name: Publications
          url: /en/projects/
          weight: 5
        - identifier: posts
          name: Posts
          url: /en/posts/
          weight: 10
        - identifier: tags
          name: Tags
          url: /en/tags/
