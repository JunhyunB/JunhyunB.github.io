<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="90" fill="#f0f4f9"/>
  
  <!-- Papers Stack -->
  <rect x="50" y="40" width="100" height="120" rx="4" fill="#ffffff" stroke="#4ead7f" stroke-width="2"/>
  <rect x="55" y="35" width="100" height="120" rx="4" fill="#ffffff" stroke="#4ead7f" stroke-width="2"/>
  <rect x="60" y="30" width="100" height="120" rx="4" fill="#ffffff" stroke="#4ead7f" stroke-width="2"/>
  
  <!-- Paper Title -->
  <rect x="75" y="45" width="70" height="6" rx="2" fill="#4ead7f"/>
  
  <!-- Paper Content -->
  <rect x="75" y="60" width="70" height="4" rx="2" fill="#d0d0d0"/>
  <rect x="75" y="70" width="70" height="4" rx="2" fill="#d0d0d0"/>
  <rect x="75" y="80" width="40" height="4" rx="2" fill="#d0d0d0"/>
  
  <!-- Magnifying Glass -->
  <circle cx="135" cy="115" r="25" fill="#ffffff" stroke="#4ead7f" stroke-width="2"/>
  <circle cx="135" cy="115" r="20" fill="#f5f5f5" stroke="#4ead7f" stroke-width="2"/>
  <rect x="150" y="130" width="25" height="6" rx="3" transform="rotate(45 150 130)" fill="#4ead7f"/>
</svg> 